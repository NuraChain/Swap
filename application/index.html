<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Nura Swap</title>
        <meta name="description" content="Nura Swap - swap tokens and provide liquidity on an open automated market maker. Self-custody, on-chain, in ten languages."/>
        <meta property="og:title" content="Nura Swap"/>
        <meta property="og:description" content="Trade straight from your wallet on an open automated market maker."/>
        <meta property="og:type" content="website"/>
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5f8"/>
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090d12"/>
        <!-- One mark everywhere. public/icon.svg, the PNGs and favicon.ico are
             generated by scripts/build-app-icons.mjs from the same shamseh the
             header draws - rerun it rather than editing them. -->
        <link rel="icon" href="/favicon.ico" sizes="48x48"/>
        <link rel="icon" type="image/svg+xml" href="/icon.svg" sizes="any"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <link rel="manifest" href="/manifest.webmanifest"/>
        <meta name="apple-mobile-web-app-title" content="Nura Swap"/>
        <script>
            // Pre-paint: apply the persisted theme class and text direction so the
            // first frame is already right. Strings localize at hydration.
            try
            {
                var theme = localStorage.getItem('nuraswap.theme');
                if (theme === 'light' || theme === 'dark') { document.documentElement.classList.add(theme); }
                var lang = localStorage.getItem('nuraswap.lang');
                if (lang && /^(en|fa|ar|es|pt|hi|zh|ru|fr|tr)$/.test(lang))
                {
                    document.documentElement.lang = lang;
                    document.documentElement.dir = (lang === 'fa' || lang === 'ar') ? 'rtl' : 'ltr';
                }
            }
            catch (error) { /* storage unavailable - defaults stand */ }
        </script>
        <link rel="stylesheet" href="/src/styles.css"/>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.azeroth" defer></script>
    </body>
</html>
