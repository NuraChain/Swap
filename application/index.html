<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Nura Swap</title>
        <meta name="description" content="Nura Swap - swap tokens and provide liquidity on an open automated market maker. Self-custody, on-chain, in ten languages."/>
        <!-- The crawler's default, stated, plus the one part of it that is opt-in:
             max-image-preview:large is what lets the 1200x630 card show at full
             width rather than as a thumbnail. scripts/build-seo.mjs REWRITES this
             in dist - on a staging origin it becomes noindex - so this line is
             what the dev server and an unprocessed build serve, not the last
             word. -->
        <meta name="robots" content="index, follow, max-image-preview:large"/>
        <meta property="og:title" content="Nura Swap"/>
        <meta property="og:description" content="Trade straight from your wallet on an open automated market maker."/>
        <meta property="og:type" content="website"/>
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5f8"/>
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090d12"/>
        <!-- One mark everywhere. public/icon.svg, the PNGs and favicon.ico are
             generated by scripts/build-app-icons.mjs from the same shamseh the
             header draws - rerun it rather than editing them. -->
        <link rel="icon" href="/favicon.ico" sizes="48x48"/>
        <link rel="icon" type="image/svg+xml" href="/icon.svg" sizes="any"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <link rel="manifest" href="/manifest.webmanifest"/>
        <meta name="apple-mobile-web-app-title" content="Nura Swap"/>
        <script>
            // Pre-paint: apply the persisted theme class so the first frame is
            // already right. The LANGUAGE is not this script's business any
            // more - azerothjs negotiates it per request and stamps lang/dir
            // onto <html> before anything here could run, and the client seeds
            // from that attribute. The one legacy duty: a visitor who chose a
            // language before the framework owned the choice has it in
            // localStorage, where no negotiation can see it - hand it to the
            // cookie once, and the old key dies.
            try
            {
                var theme = localStorage.getItem('nuraswap.theme');
                if (theme === 'light' || theme === 'dark') { document.documentElement.classList.add(theme); }
                var supported = /^(en|fa|ar|es|pt|hi|zh|ru|fr|tr)$/;
                if (document.cookie.indexOf('locale=') === -1)
                {
                    var chosen = localStorage.getItem('nuraswap.lang');
                    if (chosen !== null && supported.test(chosen))
                    {
                        document.cookie = 'locale=' + chosen + '; path=/; max-age=31536000; samesite=lax';
                    }
                    localStorage.removeItem('nuraswap.lang');
                }
            }
            catch (error) { /* storage unavailable - defaults stand */ }
        </script>
        <link rel="stylesheet" href="/src/styles.css"/>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.azeroth" defer></script>
    </body>
</html>
